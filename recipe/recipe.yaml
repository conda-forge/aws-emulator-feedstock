schema_version: 1

context:
  version: "1.0.632"

package:
  name: aws-emulator
  version: ${{ version }}

source:
  url: https://github.com/aws/aws-emulator/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 40990cdc8e959d06a62df7be6f7d9b893f58ca8a1e7988431cbaf911dacb6a11

build:
  number: 0
  # Upstream only supports building from source on Linux; the Lambda service uses
  # Linux-only `RUSAGE_THREAD`.
  skip: not linux
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # Stamp the release version, otherwise `--version` reports `0.1.0-dev`.
      EMULATOR_VERSION: ${{ version }}
    content:
      - if: build_platform != target_platform
        then:
          # cc-rs also applies CFLAGS/CXXFLAGS (the target's flags, e.g.
          # `-mabi=lp64d`) when compiling C/asm for build scripts on the build
          # machine. Restrict them to target compiles via TARGET_CFLAGS/CXXFLAGS.
          - export TARGET_CFLAGS="${CFLAGS}" TARGET_CXXFLAGS="${CXXFLAGS}"
          - unset CFLAGS CXXFLAGS
      - if: target_platform == "linux-aarch64"
        then:
          # The binary's .text exceeds the +-128 MB range of aarch64 branches.
          # GNU ld fails with `relocation truncated to fit: R_AARCH64_CALL26`
          # (after hours); lld inserts range-extension thunks.
          - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld"
      # rustc compiling the aws-emulator-router crate (pulls in all ~440 service
      # crates) gets OOM-killed on the 64 GB runners with the default 16 codegen
      # units; fewer units means fewer LLVM modules in memory at once.
      - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path core/router --config 'profile.release.package.aws-emulator-router.codegen-units=4'
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    # openh264-sys2 compiles bundled C++ sources
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - if: target_platform == "linux-aarch64"
      then: lld

tests:
  - script:
      - aws-emulator --help
      - aws-emulator --version | grep "${{ version }}"
  - package_contents:
      bin:
        - aws-emulator
      strict: true

about:
  homepage: https://docs.aws.amazon.com/emulator/latest/userguide/what-is-service.html
  summary: A local emulator of the AWS APIs
  description: |
    AWS Emulator is a local emulator of the AWS APIs. Use it to test your
    software without calling AWS, on your own machine, on a development
    server, or in continuous integration. It serves an AWS API endpoint that
    the AWS CLI and AWS SDKs can be pointed at.
  license: CC0-1.0 AND Apache-2.0
  license_file:
    - LICENSE
    - vendor/LICENSE
    - vendor/NOTICE
    - THIRDPARTY.yml
  documentation: https://docs.aws.amazon.com/emulator/latest/userguide/what-is-service.html
  repository: https://github.com/aws/aws-emulator

extra:
  recipe-maintainers:
    - pavelzw
    - xhochy
